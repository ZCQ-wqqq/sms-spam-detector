<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS Spam Detector</title>
<style>
body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
textarea { width: 100%; height: 100px; font-size: 16px; padding: 8px; box-sizing: border-box; }
input { width: 100%; padding: 6px; box-sizing: border-box; }
button { margin-top: 10px; padding: 8px 20px; font-size: 16px; }
#result { margin-top: 20px; font-size: 20px; }
.spam { color: #c0392b; }
.ham { color: #27ae60; }
</style>
</head>
<body>
<h1>SMS Spam Detector</h1>
Type an SMS message (in English) and check if it is spam.
<textarea id="text" placeholder="Congratulations! You won a free prize, call now..."></textarea>
API key (only needed on staging / production):
<input id="key" type="password">
<button onclick="check()">Check</button>
<div id="result"></div>

<script>
async function check() {
    const headers = { "Content-Type": "application/json" };
    const key = document.getElementById("key").value;
    if (key) headers["X-API-Key"] = key;

    const res = await fetch("/predict", {
        method: "POST",
        headers: headers,
        body: JSON.stringify({ text: document.getElementById("text").value })
    });
    const data = await res.json();
    const result = document.getElementById("result");

    if (!res.ok) {
        result.textContent = "Error " + res.status + ": " + JSON.stringify(data.detail);
        result.className = "";
        return;
    }
    const percent = Math.round(data.spam_probability * 100);
    result.textContent = data.label.toUpperCase() + " (spam probability " + percent + "%)";
    result.className = data.label;
}
</script>
</body>
</html>
